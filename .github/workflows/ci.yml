name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tipos (cliente, servidor y pruebas)
        run: npm run typecheck
      - name: Pruebas del servidor de juego
        run: npm test
      - name: Compilación
        run: npm run build
